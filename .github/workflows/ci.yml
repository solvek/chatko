name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major or minor tags since v8: pin a release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run coverage run -m pytest
      # The gates of docs/architecture.md §7. A package without code reports 100 %.
      - run: uv run coverage report --fail-under=90
      - run: uv run coverage report --fail-under=95 --include="src/chatko/domain/*,src/chatko/application/*,src/chatko/extension_api/*,src/chatko/routing_api/*"
      - run: uv run coverage report --fail-under=85 --include="src/extensions/chatko_telegram/*"
      - run: uv run coverage report --fail-under=85 --include="src/extensions/chatko_meshtastic/*"
      - run: uv run coverage report --fail-under=85 --include="src/extensions/chatko_briar/*"
      - run: uv run coverage report --fail-under=85 --include="src/tools/briarctl/*"
