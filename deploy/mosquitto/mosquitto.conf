# Production broker (design.md §11, D30). No anonymous clients; each user is limited by the ACL to the
# mesh's root topic. Port 1883 is reachable only inside the compose network (it is not published).
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 1883

listener 8883
cafile /mosquitto/config/tls/server.crt
certfile /mosquitto/config/tls/server.crt
keyfile /mosquitto/config/tls/server.key
tls_version tlsv1.2

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
