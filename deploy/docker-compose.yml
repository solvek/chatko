# chatko's server stack (design.md §11, D30): our Mosquitto, with TLS on 8883 for our gateways, the
# hub's virtual Meshtastic node and its briar-headless (D53). chatko itself runs next to it and reaches
# the node on 127.0.0.1:4413 and briar-headless on 127.0.0.1:7000.
# Set up with `deploy/setup.sh` first; state lives in ../data, settings in ../config (both git-ignored).
# Secrets come from ../.env, which setup.sh links as deploy/.env for Compose.
name: chatko

services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ../config/mosquitto:/mosquitto/config:ro
    ports:
      - "8883:8883"            # TLS, for our gateways; the hub's node uses 1883 inside the network
    restart: unless-stopped

  meshtasticd-kyiv:
    image: meshtastic/meshtasticd:${MESHTASTICD_TAG:-2.7.26-beta}
    command: ["meshtasticd", "--config=/etc/meshtasticd/config.yaml", "--fsdir=/var/lib/meshtasticd"]
    volumes:
      - ./meshtasticd/kyiv.yaml:/etc/meshtasticd/config.yaml:ro
      - ../data/meshtasticd-kyiv:/var/lib/meshtasticd
    ports:
      - "127.0.0.1:4413:4403"  # no authentication: never publish it beyond localhost
    depends_on: [mosquitto]
    restart: unless-stopped    # a node reboot ends the process

  briar:
    build:
      context: briar
      additional_contexts:
        # The source of our briar-headless fork (D29, D53): by default a checkout of its branch
        # `1664-private-group-api` next to this repository (../briar from chatko), or its Git URL.
        briar: ${BRIAR_SRC:-../../briar}
    image: chatko/briar-headless:${BRIAR_IMAGE_TAG:-1.5.21}
    environment:
      BRIAR_NICKNAME: ${BRIAR_NICKNAME:-chatko}
      BRIAR_PASSWORD: ${BRIAR_PASSWORD:?run deploy/setup.sh}
      BRIAR_AUTH_TOKEN: ${BRIAR_AUTH_TOKEN:?run deploy/setup.sh}
    volumes:
      - ../data/briar:/data    # the account, its database and Tor: useless without BRIAR_PASSWORD
    ports:
      - "127.0.0.1:7000:7000"  # the token protects it, but it stays on localhost all the same
    restart: unless-stopped    # a wrong password makes it exit; the log says so
