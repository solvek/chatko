[project]
name = "chatko"
version = "0.0.0"
description = "Keeps a closed group of people talking across Telegram, Meshtastic and Briar."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "watchfiles>=1.0",
]

[project.optional-dependencies]
# `chatko check-config` runs the admin's routing tests (config/test_*.py) with pytest.
test = ["pytest>=8.3"]

[project.scripts]
chatko = "chatko.app.cli:main"

# Built-in extensions are registered like third-party ones, in the `chatko.extensions` entry point
# group (docs/architecture.md §2). Each extension session adds its line here.
# [project.entry-points."chatko.extensions"]
# telegram = "chatko_telegram:TelegramExtension"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/chatko",
    "src/chatko_telegram",
    "src/chatko_meshtastic",
    "src/chatko_briar",
    "src/briarctl",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["lab", "docs"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RUF", "ASYNC", "S", "TID", "PTH",
    "T20", "TC", "PL", "ARG", "RET", "PERF", "FURB", "ANN",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Cyrillic letters are data here, not look-alikes of Latin ones.
# Fake routing scripts in tests keep the hook signatures of the routing API, like the example.
# Tests write their files in place, also inside async tests (ASYNC240).
"tests/**" = [
    "S101", "ANN", "ARG001", "ARG002", "PLR0913", "RUF001", "RUF002", "RUF003", "ASYNC240",
]
# The public test kits are test code that ships with the package.
"src/chatko/*/testing/**" = ["S101", "RUF001"]
"src/chatko/domain/transliteration.py" = ["RUF001", "RUF002", "RUF003"]
# The command line prints its results.
"src/chatko/app/**" = ["T20"]
# The hook signature is fixed by the routing API even where an argument is unused.
"routing.example.py" = ["ARG001"]

[tool.ruff.lint.pylint]
# The application's services take their ports as keyword arguments.
max-args = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
files = ["src", "tests", "routing.example.py"]
mypy_path = ["src"]
explicit_package_bases = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["lab: needs the docker lab (Mosquitto, meshtasticd, briar-headless); opt-in"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]

[tool.importlinter]
root_packages = ["chatko", "chatko_telegram", "chatko_meshtastic", "chatko_briar", "briarctl"]
include_external_packages = false

# The dependency rule of docs/architecture.md §1. Dependencies point inwards only.

[[tool.importlinter.contracts]]
name = "Layers: app > infrastructure > application > the public APIs > domain"
type = "layers"
# The two public APIs are one layer of independent siblings: the application uses both to talk to
# extensions and to the routing script; they import only the domain and never each other.
layers = [
    "chatko.app",
    "chatko.infrastructure",
    "chatko.application",
    "chatko.extension_api | chatko.routing_api",
    "chatko.domain",
]

[[tool.importlinter.contracts]]
name = "Only tests use the test kits and fakes"
type = "protected"
# Tests are outside the root packages, so no module of the code base may import a test kit, except
# the test kits themselves.
protected_modules = [
    "chatko.extension_api.testing",
    "chatko.routing_api.testing",
    "chatko.application.testing",
]
allowed_importers = [
    "chatko.extension_api.testing",
    "chatko.routing_api.testing",
    "chatko.application.testing",
]

[[tool.importlinter.contracts]]
name = "The core never imports an extension"
type = "forbidden"
source_modules = ["chatko"]
forbidden_modules = ["chatko_telegram", "chatko_meshtastic", "chatko_briar"]

[[tool.importlinter.contracts]]
name = "Extensions import only chatko.extension_api"
type = "forbidden"
source_modules = ["chatko_telegram", "chatko_meshtastic", "chatko_briar"]
forbidden_modules = [
    "chatko.domain",
    "chatko.application",
    "chatko.routing_api",
    "chatko.infrastructure",
    "chatko.app",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Extensions do not import each other"
type = "independence"
modules = ["chatko_telegram", "chatko_meshtastic", "chatko_briar"]

[[tool.importlinter.contracts]]
name = "briarctl is a separate program: it imports nothing of chatko"
type = "forbidden"
source_modules = ["briarctl"]
forbidden_modules = ["chatko", "chatko_telegram", "chatko_meshtastic", "chatko_briar"]

[[tool.importlinter.contracts]]
name = "chatko and its extensions never import briarctl"
type = "forbidden"
source_modules = ["chatko", "chatko_telegram", "chatko_meshtastic", "chatko_briar"]
forbidden_modules = ["briarctl"]
