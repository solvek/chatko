# chatko configuration example. Copy to config/chatko.yaml and edit.
# Secrets are never stored here: ${NAME} is replaced with the environment variable NAME (see .env.example).

# Extension instances. The key is the instance name; `type` selects the extension.
extensions:
  telegram:                        # one instance = one bot
    type: telegram
    bot_token: ${TELEGRAM_BOT_TOKEN} # from BotFather; there, /setprivacy → Disable before adding the bot
                                     # to groups, so it sees all messages (it needs no admin rights)
    # A chat is an endpoint by its id: a negative id for a group, the person's id for a private chat
    # with the bot (they press Start once; the hub logs the id of a private chat that is not here).
    # In a group that is not here, the bot ignores the messages, and the first one gives the admin
    # the group's id. Once the groups are set up, /setjoingroups → Disable in BotFather.

  kyiv:                            # one instance = one hub node
    type: meshtastic
    # Virtual node: a meshtasticd container (TCP API inside the Docker network only).
    connection: { tcp: "meshtasticd-kyiv:4403" }
    # Later (not in v1): a physical node: { serial: /dev/ttyUSB0 } | { ble: "AA:BB:CC:DD:EE:FF" } | { tcp: "192.168.1.50:4403" }
    long_name: chatko
    short_name: CHKO               # up to 4 characters
    region: EU_433                 # Kyiv mesh: 433.125 MHz, LongFast; the hub sets it and keeps ignore_mqtt off (design.md §6.1)
    private_key: ${MESH_KYIV_PRIVATE_KEY}  # optional, base64, 32 bytes: keeps the node's identity if its volume is lost
    mqtt:                          # required for a virtual node; any broker works
      host: mosquitto              # v1: our own Mosquitto in the same compose file (design.md §6.2, D30)
      port: 1883                   # inside the Docker network; our gateways connect on 8883 with TLS
      tls: false
      username: ${MESH_MQTT_USER}  # one Mosquitto user per hub node and per gateway
      password: ${MESH_MQTT_PASSWORD}
      root_topic: msh/EU_433       # our gateways use the same root topic
      # Later, the Kyiv community broker (logins only for a claimed physical node, D27):
      # host: mqtt.meshtastic.kyiv.ua, port: 1883, tls: false, username: <node id in hex>,
      # root_topic: node/<node id>
    channels:                      # the hub provisions its node with these, in this order; the node's
                                   # other channel slots are turned off. Names: up to 11 bytes, no spaces
      - name: LongFast             # index 0: the primary channel of the Kyiv mesh; its PSK is not the
        psk: ${KYIV_PRIMARY_PSK}   # default one: take it from the QR code at https://meshtastic.kyiv.ua/join
      - name: family
        psk: ${MESH_FAMILY_PSK}    # base64, 16 or 32 bytes (AQ== is the default key); give it to people
                                   # as a channel URL/QR code
    contacts:                      # optional: public keys of members' nodes (base64, 32 bytes, from the
                                   # Meshtastic app); the node keeps them as favorites. An example key:
      "!a1b2c3d4": "B7yTEhZ73TRS3Jg9oECbzdbk+40JH8z+Gyvs7iM6heM="
    min_send_interval_s: 4         # per hub node; at least 2.5 (the node drops texts that come too soon)

  # One instance serves any number of chats: every site and source names its own chat. Another
  # instance of a type is only for another login or another connection: a second bot with its own
  # token, a second hub node on another broker, a second Briar account. Sites and sources choose
  # an instance by its name (`ext:`).
  # telegram_street:                 # e.g. a second bot
  #   type: telegram
  #   bot_token: ${TELEGRAM_STREET_BOT_TOKEN}
  # lab:                             # e.g. a second Meshtastic node on another broker
  #   type: meshtastic
  #   connection: { tcp: "meshtasticd-lab:4403" }
  #   ...

  briar:                           # the hub joins Briar groups with `briarctl` (a person makes the group, D52)
    type: briar
    api: http://briar:7000
    auth_token: ${BRIAR_AUTH_TOKEN}

# A group's sites: the places where it lives, named by you. A site is `<group>.<name>` to the
# routing script (`family.radio`). `ext` names the extension instance; everything else in a site
# belongs to that extension, which checks it.
groups:
  family:
    sites:
      telegram: { ext: telegram, chat: -1001234567890 }
      briar: { ext: briar, group: "<Briar group id>" }          # printed by `briarctl invitation list`
      channel: { ext: kyiv, channel: family }                    # broadcast on the private channel (by name)
      radio: { ext: kyiv, dm: ["!a1b2c3d4", "!0badc0de"] }       # PKI direct messages to these nodes

  street:
    sites:
      telegram: { ext: telegram, chat: -1009876543210 }
      briar: { ext: briar, group: "<another Briar group id>" }  # any number of Briar groups
      radio: { ext: kyiv, dm: ["!a1b2c3d4"] }

# Endpoints outside any group, named like sites. Their messages go only where routing.py sends them.
sources:
  longfast: { ext: kyiv, channel: LongFast }
  owner: { ext: telegram, chat: 123456789 }                        # the owner's private chat with the bot

# Endpoints that drop a message another path brought lately: the same author label and text within
# this many seconds (docs/design.md §9.3), no longer than retention_days. Needed where two paths reach
# the hub (several hubs, a late Briar sync). Names are sites (`family.briar`) or sources.
# fingerprint_dedup_s: { family.briar: 21600 }

# How long messages and fingerprints are kept (days, default 7, at most 3650). Keep it longer than any
# network's replay.
# retention_days: 7

# Where the hub posts admin notices: errors, foreign Telegram groups.
admin_notices:
  to: owner
  new_accounts: false              # true: a notice for every account seen for the first time (to fill `people`)

# Optional: one label per human across networks. Everyone else gets a label generated from their name.
people:
  NatAda: ["telegram:111111111", "meshtastic:!a1b2c3d4", "briar:<author id>"]

# Where each message goes and how authors are labelled: config/routing.py (see routing.example.py).
# Without it, every message goes to all other sites of its group.
routing: routing.py

# Later (several hubs): other chatko installations and their accounts, so their relays are recognized.
# peers:
#   home: ["meshtastic:!0badf00d", "briar:<author id>"]
