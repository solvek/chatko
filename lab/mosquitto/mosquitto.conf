# Local lab broker, set up like production (design.md §11, D30): no anonymous clients, one user per
# node, and an ACL that keeps each user to the lab's root topic. It listens on 127.0.0.1 only.
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
